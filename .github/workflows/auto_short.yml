name: Auto YouTube Short

on:
  schedule:
    - cron: "0 17 * * *"    # 12:00 PM ET (1:00 PM in summer) - lunch scroll
    - cron: "30 0 * * *"    # 7:30 PM ET (8:30 PM in summer) - evening prime time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only - do NOT upload (the video is attached to the run as an artifact)"
        type: boolean
        default: true

permissions:
  contents: write            # lets the job commit history.json back to the repo

concurrency:
  group: auto-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate video (and upload unless dry run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python main.py

      - name: Attach preview video (dry run only)
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-short
          path: final_output.mp4
          retention-days: 3

      - name: Save post history
        if: ${{ env.DRY_RUN != 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "chore: update post history [skip ci]"
          git push || (git pull --rebase && git push)
