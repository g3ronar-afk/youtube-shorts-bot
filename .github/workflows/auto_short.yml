name: Auto YouTube Short

on:
  schedule:
    - cron: "0 17 * * *"   # 1:00 PM EST (US Peak Time)
  workflow_dispatch:        # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # Dinagdagan natin ng oras para sure

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # BAGONG DAGDAG: Naka-cache na ang APT packages (ffmpeg/imagemagick)
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-ffmpeg-imagemagick

      - name: Install ffmpeg and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python main.py
